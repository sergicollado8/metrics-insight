[project]
name = "metrics-insight"
version = "0.1.0"
description = "Herramienta de métricas de ingeniería para GitHub y Jira"
authors = [
    { name = "Sergi Collado", email = "sergi.ch8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.7",
    "PyGithub>=2.3.0",
    "pandas>=2.2.2",
    "pydantic>=2.7.4",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "build>=1.2.1",
    "types-requests>=2.31.0.6000",
    "pandas-stubs>=2.2.1.240316",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.25",
    "mkdocstrings[python]>=0.25.1",
]

[project.scripts]
metrics = "metrics_insight.infrastructure.cli.main:cli"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra -q"
